name: Blender CI

on:
  push:
    branches: [main, "ai/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: "4.5.14"
  BLENDER_DIR: ${{ github.workspace }}/.cache/blender

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository contract
        run: python tools/validate_repo.py

      - name: Verify generator source repairs are landed
        run: python tools/repair_jiangnan_source.py --check

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: .cache/blender
          key: blender-${{ runner.os }}-${{ env.BLENDER_VERSION }}

      - name: Download Blender 4.5 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$BLENDER_DIR"
          curl --fail --location --retry 3 \
            "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C "$BLENDER_DIR" --strip-components=1

      - name: Install headless OpenGL / EGL runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri

      - name: Blender version
        run: "$BLENDER_DIR/blender --version"

      - name: Bamboo asset factory smoke test
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b --factory-startup --python-exit-code 1 \
            --python tools/generate_bamboo_asset.py -- \
            --count 8 \
            --seed 36 \
            --output ci_artifacts/JN_BambooFactory.blend \
            --report ci_artifacts/bamboo-report.json

      - name: Modular architecture factory smoke test
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b --factory-startup --python-exit-code 1 \
            --python tools/generate_architecture_assets.py -- \
            --output ci_artifacts/JN_ArchitectureFactory.blend \
            --report ci_artifacts/architecture-report.json

      - name: Inn prop and interior factory smoke test
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b --factory-startup --python-exit-code 1 \
            --python tools/generate_prop_assets.py -- \
            --output ci_artifacts/JN_PropFactory.blend \
            --report ci_artifacts/prop-report.json

      - name: Ground and path factory smoke test
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b --factory-startup --python-exit-code 1 \
            --python tools/generate_ground_assets.py -- \
            --seed 36 \
            --output ci_artifacts/JN_GroundFactory.blend \
            --report ci_artifacts/ground-report.json

      - name: Render factory catalog previews
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: "surfaceless"
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b ci_artifacts/JN_BambooFactory.blend --python-exit-code 1 --python tools/render_asset_preview.py -- --resolution 640 --samples 8 --output ci_artifacts/preview-bamboo.png
          "$BLENDER_DIR/blender" -b ci_artifacts/JN_ArchitectureFactory.blend --python-exit-code 1 --python tools/render_asset_preview.py -- --resolution 640 --samples 8 --output ci_artifacts/preview-architecture.png
          "$BLENDER_DIR/blender" -b ci_artifacts/JN_PropFactory.blend --python-exit-code 1 --python tools/render_asset_preview.py -- --resolution 640 --samples 8 --output ci_artifacts/preview-props.png
          "$BLENDER_DIR/blender" -b ci_artifacts/JN_GroundFactory.blend --python-exit-code 1 --python tools/render_asset_preview.py -- --resolution 640 --samples 8 --output ci_artifacts/preview-ground.png

      - name: Rebuild authoritative scene from jiangnan.py
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b --factory-startup --python-exit-code 1 \
            --python tools/headless_rebuild.py -- \
            --source jiangnan.py \
            --stage 5 \
            --output ci_artifacts/Jiangnan-rebuilt.blend \
            --report ci_artifacts/rebuild-report.json

      - name: Validate rebuilt scene
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b ci_artifacts/Jiangnan-rebuilt.blend --python-exit-code 1 \
            --python tools/ci_validate.py -- \
            --output ci_artifacts/rebuilt-validation.json

      - name: Audit committed blend drift
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b Jiangnan.blend --python-exit-code 1 \
            --python tools/ci_validate.py -- \
            --output ci_artifacts/committed-blend-audit.json

      - name: Fast Eevee preview from rebuilt scene
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: "surfaceless"
        run: |
          set -euxo pipefail
          "$BLENDER_DIR/blender" -b ci_artifacts/Jiangnan-rebuilt.blend --python-exit-code 1 \
            --python tools/render_preview.py -- \
            --camera 三分之四 \
            --weather 0 \
            --engine BLENDER_EEVEE_NEXT \
            --resolution 640 \
            --samples 16 \
            --output ci_artifacts/preview-rain-three-quarter.png

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ci-${{ github.sha }}
          path: ci_artifacts/
          if-no-files-found: warn
          retention-days: 14
